hostname hard-sw1
service timestamps log datetime msec localtime show-timezone
service password-encryption
enable secret 9 $9$abcdefghijklmn$0123456789abcdefghijklmnopqrstuvwxyzABCDE
aaa new-model
aaa authentication login default group TACACS local
aaa accounting exec default start-stop group TACACS
username breakglass privilege 15 secret 9 $9$abcdefghijklmn$0123456789abcdefghijklmnopqrstuvwxyzABCDE
ip ssh version 2
no ip http server
login block-for 120 attempts 5 within 60
snmp-server community Str0ngRead RO SNMP-ACL
logging host 192.0.2.50
ntp server 192.0.2.1
banner login ^C Authorized access only ^C
line con 0
 exec-timeout 5 0
line vty 0 4
 access-class MGMT-ACL in
 exec-timeout 10 0
 transport input ssh
end